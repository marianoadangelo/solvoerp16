version: '3.7'
services:
  odoo-16:
    build:
      context: ./
      dockerfile: ./docker/dockerfile/Dockerfile
    command: odoo -c /opt/odoo/server-dev.conf -u payment_method_ux
    #python3 /opt/odoo/server/odoo-bin -c /opt/odoo/server-migrate.conf -d pidea --update=all --stop-after-init
#    tail -f /dev/null
#    python3 /opt/odoo/server/odoo-bin -c /opt/odoo/server-migrate.conf -d solvo --update=all --stop-after-init
#    --load=base,web,openupgrade_framework --upgrade-path=/opt/odoo/OpenUpgrade/openupgrade_scripts/scripts
    depends_on:
      - db-odoo-16
    ports:
      - "8016:8069"
      - "8116:8072"
    environment:
      - HOST=db-odoo-16
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-data-16:/var/lib/odoo
      - ./:/opt/odoo/
    links:
      - db-odoo-16
  db-odoo-16:
    image: postgres:14
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db-data-16:/var/lib/postgresql/data/pgdata
    ports:
      - "5416:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=soporte@solvoweb.com
      - PGADMIN_DEFAULT_PASSWORD=aZ537866lbm
      - PGADMIN_LISTEN_PORT=5050
    ports:
      - "5016:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db-odoo-16
volumes:
  odoo-data-16:
  db-data-16:
  pgadmin-data:
