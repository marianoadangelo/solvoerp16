services:
  {dockername}:
    container_name: {dockername}
    restart: unless-stopped
    build:
      context: ./repo
      dockerfile: ./docker/dockerfile/Dockerfile
    command: odoo -c /etc/odoo/server.conf
    ports:
      - "127.0.0.1:{port}:8069"
      - "127.0.0.1:{longpolling_port}:8072"
    environment:
      - HOST={db_host}
      - PORT={db_port}
      - USER={db_user}
      - PASSWORD={db_password}
      - ADMIN_PASSWORD={spassw}
    volumes:
      - odoo-data-16-{name}:/var/lib/odoo
      - ./repo:/opt/odoo/
      - ./server.conf:/etc/odoo/server.conf
    networks:
      - {network_name}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  odoo-data-16-{name}:
networks:
  {network_name}:
    external: {use_external_network}
